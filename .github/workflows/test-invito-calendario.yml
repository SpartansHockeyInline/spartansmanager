name: Test invito calendario
# Solo manuale (Actions > Test invito calendario > Run workflow). Non gira mai da solo.
on:
  workflow_dispatch:
    inputs:
      fase:
        description: "invita = manda 2 inviti di prova; aggiorna = aggiorna il primo e annulla il secondo"
        type: choice
        options:
          - invita
          - aggiorna
        default: invita
      serie:
        description: "numero della prova (cambialo per ripartire da inviti nuovi; 'aggiorna' deve usare lo stesso numero di 'invita')"
        type: string
        default: "1"
permissions:
  contents: read
jobs:
  invio:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Manda gli inviti di prova
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FASE: ${{ inputs.fase }}
          SERIE: ${{ inputs.serie }}
        run: python3 .github/scripts/test_invito_calendario.py

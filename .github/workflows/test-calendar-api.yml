name: Test Google Calendar (API)
# Solo manuale (Actions > Test Google Calendar (API) > Run workflow). Non gira mai da solo.
on:
  workflow_dispatch:
    inputs:
      fase:
        description: "crea = 2 eventi di prova; aggiorna = rinomina il primo e sposta il secondo; elimina = li cancella"
        type: choice
        options:
          - crea
          - aggiorna
          - elimina
        default: crea
      serie:
        description: "numero della prova (solo cifre); aggiorna ed elimina devono usare lo stesso numero di crea"
        type: string
        default: "1"
permissions:
  contents: read
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet google-auth requests
      - name: Scrive sul calendario
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          FASE: ${{ inputs.fase }}
          SERIE: ${{ inputs.serie }}
        run: python3 .github/scripts/test_calendar_api.py

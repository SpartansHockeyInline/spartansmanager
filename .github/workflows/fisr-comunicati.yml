name: Aggiorna comunicati FISR
# Scarica i comunicati ufficiali FISR (generali e campionati) e li salva in fisr-comunicati.json,
# che l'app legge dal proprio sito. Sostituisce i proxy CORS pubblici, non piu' affidabili.
# Il file viene committato solo se c'e' una novita'. Gira ogni 2 ore (GitHub puo' ritardare i giri
# programmati anche di diverse ore) e a mano da Actions > Aggiorna comunicati FISR > Run workflow.
on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/fisr_comunicati.mjs"
      - ".github/workflows/fisr-comunicati.yml"
permissions:
  contents: write
concurrency:
  group: fisr-comunicati
  cancel-in-progress: false
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Scarica i comunicati
        run: node .github/scripts/fisr_comunicati.mjs
      - name: Salva se c'e' una novita'
        run: |
          git add fisr-comunicati.json
          if git diff --cached --quiet; then echo "Nessuna modifica da salvare."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: aggiorna comunicati FISR [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "Push non riuscito dopo 3 tentativi" >&2; exit 1

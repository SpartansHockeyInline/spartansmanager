<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Verbale Assemblea dei soci</title>
<style>
  @page{size:A4;margin:2cm;}
  *{box-sizing:border-box;}
  body{font-family:'Times New Roman',Times,serif;font-size:12.5px;line-height:1.55;color:#111;max-width:800px;margin:0 auto;padding:30px;background:#fff;}
  h1{font-size:15px;text-align:center;text-transform:uppercase;margin-bottom:4px;letter-spacing:.3px;}
  h2{font-size:12.5px;text-align:center;font-weight:bold;margin-top:0;margin-bottom:22px;}
  p{margin:8px 0;text-align:justify;}
  ul{margin:6px 0 6px 22px;padding:0;}
  .odg{font-weight:bold;text-align:center;margin:18px 0 10px;}
  .punto{font-weight:bold;margin-top:18px;}
  .firme{display:flex;flex-wrap:wrap;gap:30px;justify-content:space-around;margin-top:50px;}
  .firma{flex:1;min-width:180px;text-align:center;}
  .firma .linea{border-top:1px solid #333;margin-top:45px;padding-top:4px;font-size:11px;}
  .avviso{color:#b00020;font-weight:bold;}
  .noprint{text-align:center;margin:20px 0;}
  .noprint button{font-family:inherit;font-size:13px;padding:8px 20px;border-radius:6px;border:1px solid #333;background:#f5f5f5;cursor:pointer;}
  .noprint button:hover{background:#eee;}
  .err{color:#b00020;text-align:center;padding:40px;}
  @media print{.noprint{display:none;}body{padding:0;max-width:none;}.firme,.firma{break-inside:avoid;page-break-inside:avoid;}.odg,.punto,h1,h2{break-after:avoid;page-break-after:avoid;}}
</style>
</head>
<body>
<div class="noprint"><button onclick="window.print()">🖨️ Stampa / Salva PDF</button></div>
<div id="content"><p class="err">Caricamento…</p></div>

<script>
function esc(s){return (s===null||s===undefined?'':s).toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function nl(t){return esc(t).replace(/\n/g,'<br>');}
function num(v){const n=parseInt(v,10);return isNaN(n)?0:n;}
function parseFrac(s){
  const m=/^\s*(\d+)\s*\/\s*(\d+)\s*$/.exec(s||'');
  return m&&+m[2]>0?{a:+m[1],b:+m[2],txt:m[1]+'/'+m[2]}:null;
}
function annoDa(dmy){const p=(dmy||'').split('/');return p.length===3?p[2]:'________';}

// Regola di maggioranza per deliberare (scelta dall'utente nel form).
const MAGGIORANZE={
  presenti:{txt:'della maggioranza dei presenti',ok:(f,c,a,pr)=>f*2>pr},
  votanti:{txt:'della maggioranza dei votanti',ok:(f,c,a,pr)=>f>c},
  duetzi:{txt:'della maggioranza dei due terzi dei presenti',ok:(f,c,a,pr)=>f*3>=pr*2}
};

function build(){
  const raw=new URLSearchParams(window.location.search).get('d');
  const box=document.getElementById('content');
  if(!raw){box.innerHTML='<p class="err">Parametri mancanti.</p>';return;}
  let p;
  try{p=JSON.parse(decodeURIComponent(escape(atob(raw))));}
  catch(e){box.innerHTML='<p class="err">Impossibile leggere i dati del verbale.</p>';return;}

  const straord=p.tipo!=='ordinaria';
  const tipoTxt=straord?'straordinaria':'ordinaria';
  const seconda=p.conv==='seconda';
  const aventi=num(p.aventi),presenti=num(p.presenti),deleghe=num(p.deleghe);
  const frac=parseFrac(seconda?p.quorum2:p.quorum1);
  const percent=aventi>0?Math.round(presenti*1000/aventi)/10:0;
  const quorumOk=frac?presenti*frac.b>=aventi*frac.a:true;
  const convTxt=seconda?'seconda':'prima';
  const maj=MAGGIORANZE[p.maj]||MAGGIORANZE.presenti;
  const punti=(p.punti||[]).filter(x=>x.titolo);
  const elenco=(p.elenco||[]).filter(Boolean);

  const odg=punti.map(x=>esc(x.titolo)).concat(p.varie?['Varie ed eventuali']:[]);

  const blocchi=punti.map((x,i)=>{
    let corpo='';
    if(x.vigente){
      corpo+=`<p><em>Testo vigente:</em> «${nl(x.vigente)}»</p>`;
      if(x.testo)corpo+=`<p><em>Testo proposto:</em> «${nl(x.testo)}»</p>`;
    }else if(x.testo){
      corpo+=`<p>${nl(x.testo)}</p>`;
    }
    if(x.note)corpo+=`<p>${nl(x.note)}</p>`;
    let esito;
    if(x.novoto){
      esito=`<p>L'assemblea ne prende atto.</p>`;
    }else{
      const fav=num(x.fav),con=num(x.con),ast=num(x.ast);
      const ok=maj.ok(fav,con,ast,presenti);
      esito=`<p>Posta in votazione la proposta, ottiene: favorevoli n. ${fav}, contrari n. ${con}, astenuti n. ${ast}. ${ok
        ?`Avendo la proposta riportato il voto favorevole ${maj.txt}, l'assemblea <strong>approva</strong> quanto proposto sul punto ${i+1}.`
        :`La proposta non ha riportato il voto favorevole ${maj.txt}: l'assemblea <strong>non approva</strong> quanto proposto sul punto ${i+1}.`}</p>`;
    }
    return `<p class="punto">Punto ${i+1} — ${esc(x.titolo)}</p>
    <p>Il Presidente illustra l'argomento all'assemblea.</p>${corpo}${esito}`;
  }).join('');

  const html=`
    <h1>Verbale di assemblea ${tipoTxt} dei soci</h1>
    <h2>${esc(p.asdNome)}</h2>
    <p>L'anno ${esc(annoDa(p.data))}, il giorno <strong>${esc(p.data)}</strong>, alle ore <strong>${esc(p.ora)||'________'}</strong>, presso ${esc(p.luogo)||`la sede sociale sita in ${esc(p.asdIndirizzo)}, ${esc(p.asdCap)} ${esc(p.asdCitta)}`}, si è riunita in <strong>${convTxt} convocazione</strong> l'assemblea ${tipoTxt} dei soci di ${esc(p.asdNome)}${p.asdCf?` (C.F. ${esc(p.asdCf)})`:''}, convocata dal Presidente${p.cdData?` in esecuzione della delibera del Consiglio Direttivo del ${esc(p.cdData)}`:''}${p.avvisoData?`, con avviso del ${esc(p.avvisoData)}${p.avvisoModi?` comunicato mediante ${esc(p.avvisoModi)}`:''}`:''}, per discutere e deliberare sul seguente</p>
    <p class="odg">ORDINE DEL GIORNO</p>
    <p>${odg.map((t,i)=>`${i+1}. ${t}`).join('<br>')}</p>
    ${seconda?`<p>La prima convocazione, fissata per lo stesso giorno alle ore ${esc(p.ora1)||'________'}, è andata deserta per mancanza del numero legale.</p>`:''}
    <p>Assume la presidenza dell'assemblea ${esc(p.presiede)||'________'}, che chiama a fungere da segretario verbalizzante ${esc(p.segretario)||'________'}, il quale accetta l'incarico.</p>
    <p>Il Presidente accerta e dà atto che l'assemblea è stata regolarmente convocata e che sono presenti n. <strong>${presenti}</strong> associati aventi diritto di voto su n. <strong>${aventi}</strong> aventi diritto (${percent.toString().replace('.',',')}%)${deleghe?`, di cui n. ${deleghe} rappresentati per delega scritta`:''}.${frac
      ?` Per la ${convTxt} convocazione lo statuto richiede la presenza di ${frac.txt} degli aventi diritto${quorumOk?`: l'assemblea è pertanto validamente costituita ed atta a deliberare.`:`: <span class="avviso">il quorum costitutivo non risulta raggiunto.</span>`}`
      :` Il Presidente dichiara l'assemblea validamente costituita nel rispetto del quorum previsto dallo statuto.`}</p>
    ${elenco.length?`<p>Sono presenti:</p><ul>${elenco.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:''}
    <p>Si passa alla trattazione dei punti all'ordine del giorno.</p>
    ${blocchi}
    ${p.varie?`<p class="punto">Varie ed eventuali</p><p>Nessuno dei presenti chiede la parola.</p>`:''}
    <p style="margin-top:18px;">Null'altro essendovi da deliberare, il Presidente dichiara chiusa l'assemblea alle ore <strong>${esc(p.oraChiusura)||'________'}</strong>.</p>
    <p>Del che è redatto il presente verbale, che viene letto, approvato e sottoscritto.</p>
    <div class="firme">
      <div class="firma"><div>Il Presidente dell'assemblea</div><div class="linea">${esc(p.presiede)||'________'}</div></div>
      <div class="firma"><div>Il Segretario verbalizzante</div><div class="linea">${esc(p.segretario)||'________'}</div></div>
    </div>`;
  box.innerHTML=html;
  document.title='Verbale Assemblea '+tipoTxt+' - '+(p.data||'');
}
build();
</script>
</body>
</html>
